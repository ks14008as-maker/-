<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 生理周期＆体調ノート</title>
  
  <!-- アプリ化（全画面表示）用設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="生理ノート">
  <meta name="theme-color" content="#fff0f3">

  <!-- 📖🌸 手帳と桜の組み込みSVGアイコン（お城マーク回避） -->
  <link rel="apple-touch-icon" id="appleIcon" href="">
  <link rel="icon" type="image/svg+xml" id="favicon" href="">

  <!-- PWA用のマニフェスト（Chromeマーク消去用） -->
  <script>
    // 手帳アイコン（SVG）を生成
    const notebookIconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ffccd5'/><rect x='25' y='15' width='55' height='70' rx='8' fill='%23ffffff' stroke='%23ff5c8a' stroke-width='4'/><path d='M 25 25 L 35 25 M 25 38 L 35 38 M 25 51 L 35 51 M 25 64 L 35 64 M 25 77 L 35 77' stroke='%23ff5c8a' stroke-width='4' stroke-linecap='round'/><text y='58' x='53' font-size='30' text-anchor='middle'>🌸</text></svg>`;
    const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(notebookIconSvg);

    // アイコンURLの適用
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('appleIcon').href = iconUrl;
      document.getElementById('favicon').href = iconUrl;
    });

    // 動的Web Manifestの生成（Chromeマーク消去・アプリ化）
    const manifest = {
      "name": "生理＆体調ノート",
      "short_name": "生理ノート",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#fff0f3",
      "theme_color": "#fff0f3",
      "icons": [
        {
          "src": iconUrl,
          "sizes": "512x512",
          "type": "image/svg+xml",
          "purpose": "any maskable"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);
  </script>

  <style>
    :root {
      --bg-color: #fff0f3;
      --card-bg: #ffffff;
      --primary-color: #ff5c8a;
      --primary-hover: #e04370;
      --accent-pms: #9b51e0;
      --text-main: #4a4a4a;
      --border-color: #ffccd5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-size: 1.25rem;
      color: var(--primary-color);
      text-align: center;
      margin-top: 6px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    /* 手帳・カレンダー風カードデザイン */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(255, 92, 138, 0.08);
      border: 1px solid var(--border-color);
    }

    .prediction {
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
      border: 2px solid #ffb3c6;
    }
    .prediction .main-date {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--primary-color);
      margin: 8px 0;
    }
    .prediction .range-date { font-size: 0.9rem; color: #666; }
    .prediction .stats-info {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
      border-top: 1px dashed var(--border-color);
      padding-top: 6px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--primary-color);
    }

    input[type="date"], textarea {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid #ffccd5;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #fff;
      color: var(--text-main);
      -webkit-appearance: none;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
      margin-top: 8px;
      font-family: inherit;
    }

    .tab-group {
      display: flex;
      border-bottom: 2px solid #ffe6eb;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 0.95rem;
      font-weight: bold;
      color: #999;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
    }

    .date-row { display: flex; gap: 8px; }
    .date-row > div { flex: 1; }

    .symptom-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .symptom-chip {
      padding: 7px 12px;
      border: 1px solid #ffccd5;
      background: #fff;
      color: var(--text-main);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }
    .symptom-chip.selected {
      background: #ffe6eb;
      border-color: var(--primary-color);
      color: var(--primary-color);
      font-weight: bold;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-pms { background: var(--accent-pms); color: white; }
    .btn-line { background: #06C755; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-cal { background: #4285F4; color: white; margin-top: 8px; }
    .btn-print { background: #78909c; color: white; margin-top: 8px; }

    .filter-group { display: flex; gap: 6px; margin-bottom: 12px; }
    .filter-btn {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid #ffccd5;
      background: white;
      color: var(--primary-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      text-align: center;
    }
    .filter-btn.active { background: var(--primary-color); color: white; }

    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 12px 0; border-bottom: 1px dashed var(--border-color); font-size: 0.9rem; }
    .li-header { display: flex; justify-content: space-between; align-items: center; }
    .symptom-tags { margin-top: 4px; font-size: 0.85rem; color: #7b2cbf; font-weight: 500; }
    .memo-text { margin-top: 4px; font-size: 0.85rem; color: #555; background: #fdf0f5; padding: 6px 10px; border-radius: 6px; }
    .pms-badge { display: inline-block; background: #f3e8ff; color: #7b2cbf; border: 1px solid #d8b3ff; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; }
    .delete-btn { background: none; border: border; color: #bbb; cursor: pointer; font-size: 1.1rem; padding: 4px 8px; }

    .no-data { text-align: center; color: #aaa; padding: 20px 0; font-size: 0.9rem; }

    @media print {
      body { background: white; max-width: 100%; padding: 0; color: #000; }
      .no-print, .filter-group, .delete-btn { display: none !important; }
      .card { box-shadow: none; border: 1px solid #aaa; margin-bottom: 12px; page-break-inside: avoid; }
      h1 { text-align: left; font-size: 1.3rem; color: #000; border-bottom: 2px solid #000; padding-bottom: 6px; }
      h1::after { content: " （婦人科 提出用レポート・過去1年間）"; font-size: 0.9rem; font-weight: normal; }
      .prediction { background: #f9f9f9; border: 1px solid #ccc; text-align: left; padding: 12px; }
      .prediction .main-date { color: #000; font-size: 1.1rem; margin: 4px 0; }
      .prediction .stats-info { color: #333; border-top: 1px solid #ccc; margin-top: 4px; padding-top: 4px; }
      .pms-badge { background: #eee; color: #000; border: 1px solid #888; }
      .memo-text { background: #f5f5f5; border-left: 3px solid #888; }
      li { border-bottom: 1px solid #ccc; }
      li.print-hidden { display: list-item !important; }
    }
  </style>
</head>

<body>

  <h1>🌸 生理周期＆体調ノート</h1>

  <!-- 次回予測＆周期傾向サマリー -->
  <div class="card prediction">
    <div style="font-size:0.85rem; font-weight:bold; color:#666;">次回予測・周期傾向</div>
    <div id="predictedDate" class="main-date">データが足りません</div>
    <div id="predictedRange" class="range-date">過去の生理日を登録してください</div>
    <div id="statsInfo" class="stats-info">学習データ：初期設定 (30〜46日/本命40日)</div>
  </div>

  <!-- 共有・連携ボタン群 -->
  <div class="card no-print" style="padding: 12px;">
    <button type="button" class="btn btn-line" onclick="shareToLine()">LINEで奥様に共有する</button>
    <button type="button" class="btn btn-cal" onclick="addToGoogleCalendar()">Googleカレンダーに予測を登録</button>
    <button type="button" class="btn btn-print" onclick="printReport()">病院提示用にPDF/印刷表示</button>
  </div>

  <!-- 記録フォーム -->
  <div class="card no-print">
    <div class="tab-group">
      <button type="button" class="tab-btn active" onclick="switchTab('period', this)">🌸 生理開始日</button>
      <button type="button" class="tab-btn" onclick="switchTab('pms', this)">🌙 生理前の不調(PMS)</button>
    </div>

    <!-- 生理記録タブ -->
    <div id="tabPeriod">
      <label for="startDate">生理開始日</label>
      <input type="date" id="startDate">
      <button type="button" class="btn btn-primary" onclick="addPeriodRecord()">生理日を保存する</button>
    </div>

    <!-- 生理前不調記録タブ -->
    <div id="tabPms" style="display: none;">
      <div class="date-row">
        <div>
          <label for="pmsStart">不調の開始日</label>
          <input type="date" id="pmsStart">
        </div>
        <div>
          <label for="pmsEnd">不調の終了日</label>
          <input type="date" id="pmsEnd">
        </div>
      </div>

      <label style="margin-top: 12px;">体調・症状（ワンタップ選択）</label>
      <div class="symptom-group" id="symptomContainer">
        <span class="symptom-chip" onclick="toggleSymptom(this)">😖 腹痛</span>
        <span class="symptom-chip" onclick="toggleSymptom(this)">🤕 頭痛</span>
        <span class="symptom-chip" onclick="toggleSymptom(this)">😤 イライラ</span>
        <span class="symptom-chip" onclick="toggleSymptom(this)">😣 腰痛</span>
        <span class="symptom-chip" onclick="toggleSymptom(this)">🧴 肌荒れ</span>
        <span class="symptom-chip" onclick="toggleSymptom(this)">⚠️ 不正出血</span>
        <span class="symptom-chip" onclick="toggleSymptom(this)">🥱 強い眠気</span>
        <span class="symptom-chip" id="chipOther" onclick="toggleOtherSymptom(this)">✏️ その他</span>
      </div>

      <div id="otherMemoBox" style="display: none; margin-top: 8px;">
        <label for="pmsMemo" style="font-size:0.8rem; color:#666;">メモ・具体的な症状</label>
        <textarea id="pmsMemo" placeholder="気になる症状やメモがあれば自由に入力してください"></textarea>
      </div>

      <button type="button" class="btn btn-pms" onclick="addPmsRecord()">生理前不調を保存する</button>
    </div>
  </div>

  <!-- 統合履歴表示 -->
  <div class="card">
    <h3 style="margin-top:0; font-size:0.95rem; color:var(--primary-color);">📋 過去の履歴・不調ログ（時系列）</h3>
    
    <div class="filter-group no-print">
      <button type="button" class="filter-btn active" onclick="setFilter(3, this)">直近3ヶ月</button>
      <button type="button" class="filter-btn" onclick="setFilter(6, this)">直近6ヶ月</button>
      <button type="button" class="filter-btn" onclick="setFilter(12, this)">直近1年</button>
      <button type="button" class="filter-btn" onclick="setFilter(0, this)">全期間</button>
    </div>

    <ul id="historyList"></ul>
  </div>

  <script>
    let currentFilterMonths = 3;

    window.addEventListener("DOMContentLoaded", () => {
      initDates();
      updateDisplay();
    });

    function initDates() {
      const todayStr = getTodayString();
      document.getElementById('startDate').value = todayStr;
      document.getElementById('pmsStart').value = todayStr;
      document.getElementById('pmsEnd').value = todayStr;
    }

    function getTodayString() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      document.getElementById('tabPeriod').style.display = (tab === 'period') ? 'block' : 'none';
      document.getElementById('tabPms').style.display = (tab === 'pms') ? 'block' : 'none';
    }

    function toggleSymptom(el) {
      el.classList.toggle('selected');
    }

    function toggleOtherSymptom(el) {
      el.classList.toggle('selected');
      const memoBox = document.getElementById('otherMemoBox');
      memoBox.style.display = el.classList.contains('selected') ? 'block' : 'none';
    }

    function getPeriodRecords() {
      try {
        return JSON.parse(localStorage.getItem('periodRecordsFull') || '[]');
      } catch (e) {
        return [];
      }
    }

    function getPmsRecords() {
      try {
        return JSON.parse(localStorage.getItem('pmsRecordsFull') || '[]');
      } catch (e) {
        return [];
      }
    }

    function addPeriodRecord() {
      const dateInput = document.getElementById('startDate').value;
      if (!dateInput) return;

      let records = getPeriodRecords();
      if (!records.some(r => r.date === dateInput)) {
        records.push({ date: dateInput });
        records.sort((a, b) => new Date(a.date) - new Date(b.date));
        localStorage.setItem('periodRecordsFull', JSON.stringify(records));
      }

      updateDisplay();
    }

    function addPmsRecord() {
      const startDate = document.getElementById('pmsStart').value;
      const endDate = document.getElementById('pmsEnd').value;
      if (!startDate || !endDate) return;
      if (new Date(startDate) > new Date(endDate)) return;

      const selectedSymptoms = [];
      document.querySelectorAll('.symptom-chip.selected').forEach(chip => {
        if (chip.id !== 'chipOther') {
          selectedSymptoms.push(chip.innerText);
        }
      });

      const isOtherSelected = document.getElementById('chipOther').classList.contains('selected');
      const memoText = isOtherSelected ? document.getElementById('pmsMemo').value.trim() : '';

      let pmsRecords = getPmsRecords();
      pmsRecords.push({ 
        id: Date.now(), 
        startDate, 
        endDate, 
        symptoms: selectedSymptoms,
        memo: memoText 
      });
      pmsRecords.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
      localStorage.setItem('pmsRecordsFull', JSON.stringify(pmsRecords));

      // フォームのクリア
      document.querySelectorAll('.symptom-chip').forEach(c => c.classList.remove('selected'));
      document.getElementById('otherMemoBox').style.display = 'none';
      document.getElementById('pmsMemo').value = '';

      updateDisplay();
    }

    function deletePeriod(dateToDelete) {
      if (!confirm(`${dateToDelete} の生理記録を削除しますか？`)) return;
      let records = getPeriodRecords().filter(r => r.date !== dateToDelete);
      localStorage.setItem('periodRecordsFull', JSON.stringify(records));
      updateDisplay();
    }

    function deletePms(idToDelete) {
      if (!confirm(`この生理前不調の記録を削除しますか？`)) return;
      let records = getPmsRecords().filter(r => r.id !== idToDelete);
      localStorage.setItem('pmsRecordsFull', JSON.stringify(records));
      updateDisplay();
    }

    function setFilter(months, btnElement) {
      currentFilterMonths = months;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      updateDisplay();
    }

    function calculatePrediction() {
      const periodRecords = getPeriodRecords();
      if (periodRecords.length === 0) return null;

      const cycles = [];
      for (let i = 1; i < periodRecords.length; i++) {
        const prev = new Date(periodRecords[i - 1].date);
        const curr = new Date(periodRecords[i].date);
        cycles.push(Math.round((curr - prev) / (1000 * 60 * 60 * 24)));
      }

      let avgCycle = 40, minCycle = 30, maxCycle = 46, isCustomStats = false;
      if (cycles.length >= 2) {
        const recent = cycles.slice(-6);
        avgCycle = Math.round(recent.reduce((a, b) => a + b, 0) / recent.length);
        minCycle = Math.min(...recent);
        maxCycle = Math.max(...recent);
        isCustomStats = true;
      }

      const lastDate = new Date(periodRecords[periodRecords.length - 1].date);
      const bestEst = new Date(lastDate); bestEst.setDate(bestEst.getDate() + avgCycle);
      const minEst = new Date(lastDate); minEst.setDate(minEst.getDate() + minCycle);
      const maxEst = new Date(lastDate); maxEst.setDate(maxEst.getDate() + maxCycle);

      return { bestEst, minEst, maxEst, avgCycle, minCycle, maxCycle, isCustomStats };
    }

    function updateDisplay() {
      const periodRecords = getPeriodRecords();
      const pmsRecords = getPmsRecords();
      const listEl = document.getElementById('historyList');
      listEl.innerHTML = '';

      const pred = calculatePrediction();

      if (!pred) {
        document.getElementById('predictedDate').innerText = 'データが足りません';
        document.getElementById('predictedRange').innerText = '過去の生理日を登録してください';
        document.getElementById('statsInfo').innerText = 'データなし';
      } else {
        const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;

        document.getElementById('predictedDate').innerText = `次回予測（本命）：${fmt(pred.bestEst)} 頃`;
        document.getElementById('predictedRange').innerText = `ありそうな期間：${fmt(pred.minEst)} 〜 ${fmt(pred.maxEst)}`;
        
        document.getElementById('statsInfo').innerText = pred.isCustomStats 
          ? `過去実績より算出：平均周期 ${pred.avgCycle}日（変動幅: ${pred.minCycle}〜${pred.maxCycle}日）`
          : `初期設定（30〜46日/本命40日）で予測中（蓄積により自動更新）`;
      }

      const combined = [];
      periodRecords.forEach(p => combined.push({ type: 'period', date: p.date, raw: p }));
      pmsRecords.forEach(p => combined.push({ type: 'pms', date: p.startDate, raw: p }));
      
      combined.sort((a, b) => new Date(b.date) - new Date(a.date));

      const now = new Date();
      let renderedCount = 0;

      const oneYearAgo = new Date();
      oneYearAgo.setFullYear(now.getFullYear() - 1);

      combined.forEach(item => {
        const currDate = new Date(item.date);

        if (currDate < oneYearAgo) return;

        let isFilterMatch = true;
        if (currentFilterMonths > 0) {
          const limitDate = new Date();
          limitDate.setMonth(now.getMonth() - currentFilterMonths);
          if (currDate < limitDate) isFilterMatch = false;
        }

        if (isFilterMatch) renderedCount++;

        const li = document.createElement('li');
        if (!isFilterMatch) {
          li.classList.add('print-hidden');
          li.style.display = 'none';
        }

        if (item.type === 'period') {
          const originalIndex = periodRecords.findIndex(r => r.date === item.date);
          let cycleText = '';
          if (originalIndex > 0) {
            const prevDate = new Date(periodRecords[originalIndex - 1].date);
            const diffDays = Math.round((currDate - prevDate) / (1000 * 60 * 60 * 24));
            cycleText = `（周期: ${diffDays}日）`;
          }

          li.innerHTML = `
            <div class="li-header">
              <span>🌸 <strong>生理開始：${item.date}</strong> <small style="color:#666">${cycleText}</small></span>
              <button type="button" class="delete-btn no-print" onclick="deletePeriod('${item.date}')">✕</button>
            </div>
          `;
        } else if (item.type === 'pms') {
          const pms = item.raw;
          const symptomText = pms.symptoms && pms.symptoms.length > 0 
            ? `<div class="symptom-tags">主訴・症状: ${pms.symptoms.join(' / ')}</div>` 
            : '';
          const memoDisplay = pms.memo ? `<div class="memo-text">💬 メモ: ${pms.memo}</div>` : '';

          const s = new Date(pms.startDate);
          const e = new Date(pms.endDate);
          const durationDays = Math.round((e - s) / (1000 * 60 * 60 * 24)) + 1;

          li.innerHTML = `
            <div class="pms-badge">🌙 生理前不調 (PMS) ${durationDays}日間</div>
            <div class="li-header">
              <span><strong>${pms.startDate} 〜 ${pms.endDate}</strong></span>
              <button type="button" class="delete-btn no-print" onclick="deletePms(${pms.id})">✕</button>
            </div>
            ${symptomText}
            ${memoDisplay}
          `;
        }

        listEl.appendChild(li);
      });

      if (renderedCount === 0 && listEl.children.length === 0) {
        listEl.innerHTML = '<li class="no-data">記録されたデータがありません</li>';
      }
    }

    function printReport() {
      window.print();
    }

    function addToGoogleCalendar() {
      const pred = calculatePrediction();
      if (!pred) return;

      const formatDateForCal = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}${m}${day}`;
      };

      const startDateStr = formatDateForCal(pred.minEst);
      const nextDayOfMax = new Date(pred.maxEst);
      nextDayOfMax.setDate(nextDayOfMax.getDate() + 1);
      const endDateStr = formatDateForCal(nextDayOfMax);

      const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      const title = encodeURIComponent("🌸 生理予想期間");
      const details = encodeURIComponent(`本命予想日：${fmt(pred.bestEst)}頃\nありそうな期間：${fmt(pred.minEst)} 〜 ${fmt(pred.maxEst)}`);

      const calUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startDateStr}/${endDateStr}&details=${details}`;
      
      window.open(calUrl, '_blank');
    }

    function shareToLine() {
      const pred = calculatePrediction();
      if (!pred) return;

      const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      const text = `次回生理の予想共有だよ！\n\n【一番高確率】${fmt(pred.bestEst)} 頃\n【予定範囲】${fmt(pred.minEst)} 〜 ${fmt(pred.maxEst)}\n\n無理せず体調第一で過ごしてね！`;
      
      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
      window.open(lineUrl, '_blank');
    }
  </script>
