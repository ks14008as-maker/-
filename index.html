<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 生理＆体調ノート</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="pink">
  <meta name="apple-mobile-web-app-title" content="生理ノート">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3063/3063071.png">

  <style>
    :root { --soft-pink: #fff0f5; --main-pink: #ff85a2; --text-color: #6a5e5e; --bg-paper: #fffcfd; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: var(--soft-pink); margin: 0; padding: 20px; color: var(--text-color); }
    
    /* 手帳・カレンダー風のデザイン */
    .planner-card { background: var(--bg-paper); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(255,133,162,0.15); border: 1px solid #ffe4e6; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; color: var(--main-pink); text-align: center; margin-top: 0; }
    
    label { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; display: block; color: var(--main-pink); }
    input[type="date"], textarea { width: 100%; padding: 12px; border: 1px solid #ffd1dc; border-radius: 12px; font-size: 1rem; box-sizing: border-box; background: #fffdfd; }
    textarea { margin-top: 8px; height: 60px; }
    
    .symptom-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .symptom-chip { padding: 8px 14px; border: 1px solid var(--main-pink); border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.3s; color: var(--main-pink); }
    .symptom-chip.selected { background: var(--main-pink); color: white; }

    .btn { width: 100%; padding: 14px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
    .btn-main { background: var(--main-pink); }
    .btn-sub { background: #dcdcdc; color: #666; margin-top: 5px; }

    ul { list-style: none; padding: 0; }
    li { padding: 12px; border-bottom: 1px dashed #ffd1dc; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>🌸 生理＆体調ノート</h1>

  <div class="planner-card">
    <label>🌸 生理開始日を記録</label>
    <input type="date" id="startDate">
    <button class="btn btn-main" onclick="addPeriodRecord()">保存する</button>
  </div>

  <div class="planner-card">
    <label>🌙 体調メモ (PMSなど)</label>
    <div class="symptom-group" id="symptomContainer">
      <span class="symptom-chip" onclick="toggleSymptom(this)">腹痛</span>
      <span class="symptom-chip" onclick="toggleSymptom(this)">頭痛</span>
      <span class="symptom-chip" onclick="toggleSymptom(this)">イライラ</span>
      <span class="symptom-chip" onclick="toggleSymptom(this, true)">その他</span>
    </div>
    <textarea id="otherText" style="display:none;" placeholder="ここに内容を入力..."></textarea>
    <button class="btn btn-main" onclick="addPmsRecord()">記録する</button>
  </div>

  <div class="planner-card">
    <h3 style="font-size:1rem; margin-top:0;">📋 履歴</h3>
    <ul id="historyList"></ul>
    <button class="btn btn-sub" onclick="window.print()">病院用レポートを印刷</button>
  </div>

  <script>
    // ページロード時に日付セット
    document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

    function toggleSymptom(el, isOther) {
      el.classList.toggle('selected');
      if (isOther) {
        document.getElementById('otherText').style.display = el.classList.contains('selected') ? 'block' : 'none';
      }
    }

    function addPeriodRecord() {
      const date = document.getElementById('startDate').value;
      let data = JSON.parse(localStorage.getItem('logs') || '[]');
      data.push({ type: 'period', date: date });
      localStorage.setItem('logs', JSON.stringify(data));
      updateDisplay();
    }

    function addPmsRecord() {
      const symptoms = Array.from(document.querySelectorAll('.symptom-chip.selected')).map(el => el.innerText);
      const memo = document.getElementById('otherText').value;
      let data = JSON.parse(localStorage.getItem('logs') || '[]');
      data.push({ type: 'pms', date: new Date().toISOString().split('T')[0], text: symptoms.join(',') + (memo ? ' (' + memo + ')' : '') });
      localStorage.setItem('logs', JSON.stringify(data));
      updateDisplay();
    }

    function updateDisplay() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const data = JSON.parse(localStorage.getItem('logs') || '[]');
      data.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.innerText = `${item.date} : ${item.type === 'period' ? '🌸 生理開始' : '🌙 ' + item.text}`;
        list.appendChild(li);
      });
    }

    updateDisplay();
  </script>
</body>
</html>
